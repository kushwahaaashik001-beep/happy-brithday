<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖 Adarsh & Aarushi 💖</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  overflow: hidden;
  background: linear-gradient(135deg, #1a0011, #2d0a1e, #1a0020);
  height: 100vh;
  width: 100vw;
  display: flex;
  align-items: center;
  justify-content: center;
}

#particles {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}

.heart-particle {
  position: absolute;
  font-size: 20px;
  animation: floatUp linear infinite;
  opacity: 0;
  pointer-events: none;
}

@keyframes floatUp {
  0% {
    transform: translateY(100vh) scale(0.5) rotate(0deg);
    opacity: 0;
  }
  10% {
    opacity: 1;
  }
  90% {
    opacity: 1;
  }
  100% {
    transform: translateY(-10vh) scale(1.2) rotate(360deg);
    opacity: 0;
  }
}

.sparkle {
  position: absolute;
  width: 6px;
  height: 6px;
  background: #fff;
  border-radius: 50%;
  animation: sparkleAnim 3s ease-in-out infinite;
  pointer-events: none;
}

@keyframes sparkleAnim {
  0%, 100% { opacity: 0; transform: scale(0); }
  50% { opacity: 1; transform: scale(1); }
}

.screen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 10;
  transition: opacity 0.8s ease, transform 0.8s ease;
}

#onboarding {
  background: radial-gradient(ellipse at center, rgba(255, 20, 80, 0.15), transparent 70%);
}

#onboarding.hidden {
  opacity: 0;
  transform: scale(1.1);
  pointer-events: none;
}

#main-screen {
  background: radial-gradient(ellipse at center, rgba(255, 50, 100, 0.1), transparent 60%);
  opacity: 0;
  transform: scale(0.9);
  pointer-events: none;
}

#main-screen.visible {
  opacity: 1;
  transform: scale(1);
  pointer-events: all;
}

.onboarding-title {
  font-size: clamp(2rem, 6vw, 4rem);
  font-weight: 700;
  background: linear-gradient(135deg, #ff6b9d, #ff8fab, #ffb3c6, #ff6b9d);
  background-size: 300% 300%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: gradientShift 4s ease infinite;
  text-align: center;
  margin-bottom: 10px;
  text-shadow: none;
}

@keyframes gradientShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.birthday-text {
  font-size: clamp(1rem, 3vw, 1.5rem);
  color: #ffb3c6;
  text-align: center;
  margin-bottom: 30px;
  animation: fadeInUp 1s ease 0.5s both;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.names-container {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 20px;
  animation: fadeInUp 1s ease 0.8s both;
}

.name {
  font-size: clamp(2.5rem, 8vw, 5rem);
  font-weight: 800;
  background: linear-gradient(135deg, #ff69b4, #ff1493, #c71585);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  position: relative;
  animation: pulse 2s ease-in-out infinite;
}

.name.adarsh {
  background: linear-gradient(135deg, #ff69b4, #ff1493, #c71585);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.name.aarushi {
  background: linear-gradient(135deg, #ff69b4, #ff1493, #c71585);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.heart-between {
  font-size: clamp(1.5rem, 4vw, 2.5rem);
  animation: heartbeat 1.2s ease-in-out infinite;
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  15% { transform: scale(1.3); }
  30% { transform: scale(1); }
  45% { transform: scale(1.2); }
  60% { transform: scale(1); }
}

.love-message {
  font-size: clamp(1.2rem, 3.5vw, 2rem);
  color: #ffc0cb;
  text-align: center;
  margin-bottom: 10px;
  animation: fadeInUp 1s ease 1.1s both;
}

.love-message .emoji {
  animation: bounce 0.6s ease infinite alternate;
}

@keyframes bounce {
  from { transform: translateY(0); }
  to { transform: translateY(-10px); }
}

.special-text {
  font-size: clamp(0.9rem, 2.5vw, 1.2rem);
  color: #ffb3c6;
  text-align: center;
  margin-bottom: 40px;
  animation: fadeInUp 1s ease 1.4s both;
  font-style: italic;
}

.enter-btn {
  padding: 18px 50px;
  font-size: clamp(1rem, 2.5vw, 1.3rem);
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, #ff1493, #ff69b4, #ff8fab);
  border: none;
  border-radius: 50px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  animation: fadeInUp 1s ease 1.7s both;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  box-shadow: 0 0 30px rgba(255, 20, 147, 0.4), 0 0 60px rgba(255, 105, 180, 0.2);
}

.enter-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 40px rgba(255, 20, 147, 0.6), 0 0 80px rgba(255, 105, 180, 0.3);
}

.enter-btn:active {
  transform: scale(0.98);
}

.enter-btn::after {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.2), transparent);
  animation: btnShine 3s ease-in-out infinite;
}

@keyframes btnShine {
  0% { transform: translateX(-100%) rotate(45deg); }
  100% { transform: translateX(100%) rotate(45deg); }
}

.main-title {
  font-size: clamp(1.8rem, 5vw, 3rem);
  font-weight: 700;
  background: linear-gradient(135deg, #ff69b4, #ff1493, #ffb3c6);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-align: center;
  margin-bottom: 15px;
  animation: fadeInUp 0.8s ease both;
}

.main-heart {
  font-size: clamp(3rem, 10vw, 5rem);
  animation: heartbeat 1.2s ease-in-out infinite;
  margin-bottom: 20px;
}

.love-words {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
  margin: 20px 0;
  max-width: 90vw;
  animation: fadeInUp 0.8s ease 0.3s both;
}

.love-word {
  padding: 8px 20px;
  border-radius: 30px;
  font-size: clamp(0.8rem, 2vw, 1rem);
  font-weight: 600;
  background: rgba(255, 105, 180, 0.15);
  border: 1px solid rgba(255, 105, 180, 0.3);
  color: #ffc0cb;
  animation: fadeInUp 0.6s ease both;
  transition: transform 0.3s ease, background 0.3s ease;
}

.love-word:hover {
  transform: scale(1.1);
  background: rgba(255, 105, 180, 0.3);
}

.love-word:nth-child(1) { animation-delay: 0.3s; }
.love-word:nth-child(2) { animation-delay: 0.4s; }
.love-word:nth-child(3) { animation-delay: 0.5s; }
.love-word:nth-child(4) { animation-delay: 0.6s; }
.love-word:nth-child(5) { animation-delay: 0.7s; }
.love-word:nth-child(6) { animation-delay: 0.8s; }
.love-word:nth-child(7) { animation-delay: 0.9s; }
.love-word:nth-child(8) { animation-delay: 1.0s; }
.love-word:nth-child(9) { animation-delay: 1.1s; }
.love-word:nth-child(10) { animation-delay: 1.2s; }
.love-word:nth-child(11) { animation-delay: 1.3s; }
.love-word:nth-child(12) { animation-delay: 1.4s; }

.couple-text {
  font-size: clamp(1rem, 3vw, 1.5rem);
  color: #ffb3c6;
  text-align: center;
  margin: 20px 0;
  animation: fadeInUp 0.8s ease 0.5s both;
}

.couple-text .highlight {
  background: linear-gradient(135deg, #ff69b4, #ff1493);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-weight: 700;
}

.footer-emoji {
  font-size: clamp(1.5rem, 4vw, 2.5rem);
  margin-top: 30px;
  animation: fadeInUp 0.8s ease 0.8s both;
}

.footer-emoji span {
  display: inline-block;
  animation: bounce 0.6s ease infinite alternate;
}

.footer-emoji span:nth-child(1) { animation-delay: 0s; }
.footer-emoji span:nth-child(2) { animation-delay: 0.1s; }
.footer-emoji span:nth-child(3) { animation-delay: 0.2s; }
.footer-emoji span:nth-child(4) { animation-delay: 0.3s; }
.footer-emoji span:nth-child(5) { animation-delay: 0.4s; }
.footer-emoji span:nth-child(6) { animation-delay: 0.5s; }
.footer-emoji span:nth-child(7) { animation-delay: 0.6s; }
.footer-emoji span:nth-child(8) { animation-delay: 0.7s; }

.continuous-hearts {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 10px;
  padding: 20px;
  pointer-events: none;
  z-index: 5;
}

.continuous-hearts span {
  animation: bottomFloat 4s ease-in-out infinite;
  opacity: 0.6;
}

.continuous-hearts span:nth-child(odd) {
  animation-duration: 3s;
  animation-delay: 0.5s;
}

@keyframes bottomFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.3; }
  50% { transform: translateY(-30px) rotate(10deg); opacity: 0.8; }
}

.rose {
  position: fixed;
  bottom: -50px;
  font-size: 1.5rem;
  animation: roseFall linear infinite;
  pointer-events: none;
  z-index: 1;
}

@keyframes roseFall {
  0% { transform: translateY(0) rotate(0deg); opacity: 0; }
  10% { opacity: 0.8; }
  90% { opacity: 0.8; }
  100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
}

@media (max-width: 480px) {
  .names-container {
    gap: 10px;
  }
  .love-words {
    gap: 8px;
  }
  .love-word {
    padding: 6px 14px;
  }
}
</style>
</head>
<body>

<div id="particles"></div>

<div id="onboarding" class="screen">
  <div class="onboarding-title">Happy Birthday 🎂</div>
  <div class="birthday-text">A special day for a special girl</div>
  <div class="names-container">
    <span class="name adarsh">Adarsh</span>
    <span class="heart-between">❤️</span>
    <span class="name aarushi">Aarushi</span>
  </div>
  <div class="love-message">
    <span class="emoji">💕</span> I Love You <span class="emoji">💕</span>
  </div>
  <div class="special-text">
    You are my everything, my heart beats only for you 💖
  </div>
  <button class="enter-btn" id="enterBtn">Enter 💝</button>
</div>

<div id="main-screen" class="screen">
  <div class="main-heart">❤️</div>
  <div class="main-title">I Love You Aarushi 💖</div>
  <div class="couple-text">
    <span class="highlight">Adarsh</span> & <span class="highlight">Aarushi</span> — Forever Together 💑
  </div>
  <div class="love-words" id="loveWords"></div>
  <div class="love-message" style="margin-top: 20px;">
    <span class="emoji">💗</span> You make my world beautiful <span class="emoji">💗</span>
  </div>
  <div class="footer-emoji">
    <span>💖</span><span>💕</span><span>💗</span><span>💖</span><span>💕</span><span>💗</span><span>💖</span><span>💕</span>
  </div>
</div>

<div class="continuous-hearts" id="bottomHearts"></div>

<script>
(function() {
  var particles = document.getElementById('particles');
  var bottomHearts = document.getElementById('bottomHearts');
  var enterBtn = document.getElementById('enterBtn');
  var onboarding = document.getElementById('onboarding');
  var mainScreen = document.getElementById('main-screen');
  var loveWordsContainer = document.getElementById('loveWords');

  var loveWords = [
    '❤️ You are my sunshine',
    '💕 My heart is yours',
    '💖 Forever and always',
    '💗 You complete me',
    '💝 My everything',
    '💘 My soulmate',
    '💓 Beating for you',
    '💞 Together forever',
    '💌 My love letter',
    '🌹 You are beautiful',
    '✨ My angel',
    '🦋 My world is you'
  ];

  function createHeartParticle() {
    var heart = document.createElement('div');
    heart.className = 'heart-particle';
    var hearts = ['❤️', '💕', '💗', '💖', '💝', '💘', '💓', '💞'];
    heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
    heart.style.left = Math.random() * 100 + '%';
    heart.style.fontSize = (Math.random() * 20 + 12) + 'px';
    heart.style.animationDuration = (Math.random() * 4 + 4) + 's';
    heart.style.animationDelay = (Math.random() * 2) + 's';
    particles.appendChild(heart);
    setTimeout(function() {
      if (heart.parentNode) heart.parentNode.removeChild(heart);
    }, 8000);
  }

  function createSparkle() {
    var sparkle = document.createElement('div');
    sparkle.className = 'sparkle';
    sparkle.style.left = Math.random() * 100 + '%';
    sparkle.style.top = Math.random() * 100 + '%';
    sparkle.style.animationDuration = (Math.random() * 2 + 2) + 's';
    particles.appendChild(sparkle);
    setTimeout(function() {
      if (sparkle.parentNode) sparkle.parentNode.removeChild(sparkle);
    }, 4000);
  }

  function createRose() {
    var rose = document.createElement('div');
    rose.className = 'rose';
    rose.textContent = '🌹';
    rose.style.left = Math.random() * 100 + '%';
    rose.style.animationDuration = (Math.random() * 5 + 5) + 's';
    rose.style.animationDelay = (Math.random() * 3) + 's';
    particles.appendChild(rose);
    setTimeout(function() {
      if (rose.parentNode) rose.parentNode.removeChild(rose);
    }, 10000);
  }

  function createBottomHeart() {
    var hearts = ['❤️', '💕', '💗', '💖'];
    var span = document.createElement('span');
    span.textContent = hearts[Math.floor(Math.random() * hearts.length)];
    span.style.fontSize = (Math.random() * 10 + 14) + 'px';
    bottomHearts.appendChild(span);
    setTimeout(function() {
      if (span.parentNode) span.parentNode.removeChild(span);
    }, 5000);
  }

  function renderLoveWords() {
    loveWordsContainer.innerHTML = '';
    loveWords.forEach(function(word) {
      var div = document.createElement('div');
      div.className = 'love-word';
      div.textContent = word;
      loveWordsContainer.appendChild(div);
    });
  }

  var heartInterval = setInterval(createHeartParticle, 600);
  var sparkleInterval = setInterval(createSparkle, 800);
  var roseInterval = setInterval(createRose, 2000);
  var bottomHeartInterval = setInterval(createBottomHeart, 1500);

  enterBtn.addEventListener('click', function() {
    onboarding.classList.add('hidden');
    setTimeout(function() {
      onboarding.style.display = 'none';
      mainScreen.classList.add('visible');
      renderLoveWords();
    }, 800);
  });

  document.addEventListener('click', function(e) {
    if (mainScreen.classList.contains('visible')) {
      var burst = [];
      for (var i = 0; i < 5; i++) {
        var h = document.createElement('div');
        h.className = 'heart-particle';
        var hearts = ['❤️', '💕', '💗', '💖'];
        h.textContent = hearts[Math.floor(Math.random() * hearts.length)];
        h.style.left = e.clientX + 'px';
        h.style.top = e.clientY + 'px';
        h.style.fontSize = (Math.random() * 15 + 14) + 'px';
        h.style.animationDuration = (Math.random() * 2 + 2) + 's';
        particles.appendChild(h);
        burst.push(h);
      }
      setTimeout(function() {
        burst.forEach(function(b) {
          if (b.parentNode) b.parentNode.removeChild(b);
        });
      }, 4000);
    }
  });

  renderLoveWords();
})();
</script>
</body>
</html>
